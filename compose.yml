services:
  service-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: egwn_grafana
      POSTGRES_USER: egwn_grafana
      POSTGRES_PASSWORD: ${SERVICE_DB_PASSWORD:?Set SERVICE_DB_PASSWORD}
    volumes:
      - service-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egwn_grafana"]
      interval: 5s
      timeout: 5s
      retries: 20
  keycloak-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
  keycloak:
    build:
      context: ./keycloak
    image: egwn-keycloak:26.8.2
    restart: unless-stopped
    command: ["start", "--optimized"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-bootstrap-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: https://${KEYCLOAK_DOMAIN:?Set KEYCLOAK_DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      EGWN_BACKEND_URL: https://${REGISTRATION_DOMAIN:?Set REGISTRATION_DOMAIN}
      EGWN_INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN}
    volumes:
      - ${KEYCLOAK_THEME_DIR:-./keycloak/theme/egwn}:/opt/keycloak/themes/egwn:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:?Set GRAFANA_DOMAIN}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-provisioner}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?Set GRAFANA_SECRET_KEY}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_SECRET:?Set GRAFANA_OIDC_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://${KEYCLOAK_DOMAIN}/realms/egwn/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://${KEYCLOAK_DOMAIN}/realms/egwn/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://${KEYCLOAK_DOMAIN}/realms/egwn/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "false"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "'None'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ORG_ATTRIBUTE_PATH: "[egwn_org]"
      GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: "false"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
      GF_LOG_LEVEL: warn
    volumes:
      - grafana:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 60
  migrate:
    build: .
    image: egwn-grafana:local
    environment: &api-environment
      ConnectionStrings__Service: Host=service-db;Database=egwn_grafana;Username=egwn_grafana;Password=${SERVICE_DB_PASSWORD}
      Grafana__BaseUrl: http://grafana:3000
      Grafana__AdminUser: ${GRAFANA_ADMIN_USER:-provisioner}
      Grafana__AdminPassword: ${GRAFANA_ADMIN_PASSWORD}
      Measurement__Enabled: ${MEASUREMENT_ENABLED:-false}
      Measurement__ProvisioningConnectionString: ${PERSISTENCE_PROVISIONING_CONNECTION:-}
      Measurement__GrafanaDatabaseHost: ${PERSISTENCE_DB_HOST:-egwn-timescaledb}
      Measurement__GrafanaDatabasePort: ${PERSISTENCE_DB_PORT:-5432}
      Measurement__CredentialKey: ${MEASUREMENT_CREDENTIAL_KEY:-}
      Keycloak__BaseUrl: https://${KEYCLOAK_DOMAIN}
      Keycloak__Realm: egwn
      Keycloak__ClientId: egwn-provisioner
      Keycloak__ClientSecret: ${PROVISIONER_OIDC_SECRET:?Set PROVISIONER_OIDC_SECRET}
      Registration__InternalToken: ${INTERNAL_TOKEN}
      Registration__HashKey: ${REGISTRATION_HASH_KEY:?Set REGISTRATION_HASH_KEY}
      RabbitMQ__Enabled: "true"
      RabbitMQ__HostName: ${RABBITMQ_HOST:?Set RABBITMQ_HOST}
      RabbitMQ__Port: ${RABBITMQ_PORT:-5671}
      RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-/}
      RabbitMQ__UserName: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RabbitMQ__UseTls: "true"
    command: ["--migrate"]
    depends_on:
      service-db:
        condition: service_healthy
  api:
    image: egwn-grafana:local
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      grafana:
        condition: service_healthy
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN}
      KEYCLOAK_DOMAIN: ${KEYCLOAK_DOMAIN}
      REGISTRATION_DOMAIN: ${REGISTRATION_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - grafana
      - keycloak
volumes:
  service-db:
  keycloak-db:
  grafana:
  caddy-data:
  caddy-config:
